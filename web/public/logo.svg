<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="TracerConnect Logo">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    
    <!-- Accent gradient for connections -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded square with gradient -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGradient)" filter="url(#softShadow)"/>
  
  <!-- Connection network lines -->
  <g stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Central node connections -->
    <path d="M64 64 L64 32" />
    <path d="M64 64 L64 96" />
    <path d="M64 64 L32 64" />
    <path d="M64 64 L96 64" />
    <path d="M64 64 L40 40" />
    <path d="M64 64 L88 40" />
    <path d="M64 64 L40 88" />
    <path d="M64 64 L88 88" />
  </g>
  
  <!-- Connection nodes -->
  <g fill="url(#accentGradient)">
    <!-- Center node (larger) -->
    <circle cx="64" cy="64" r="8" filter="url(#glow)"/>
    
    <!-- Cardinal nodes -->
    <circle cx="64" cy="32" r="5"/>
    <circle cx="64" cy="96" r="5"/>
    <circle cx="32" cy="64" r="5"/>
    <circle cx="96" cy="64" r="5"/>
    
    <!-- Diagonal nodes -->
    <circle cx="40" cy="40" r="4"/>
    <circle cx="88" cy="40" r="4"/>
    <circle cx="40" cy="88" r="4"/>
    <circle cx="88" cy="88" r="4"/>
  </g>
  
  <!-- White "TC" text overlay (optional - for brand recognition) -->
  <text x="64" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" font-weight="800" fill="white" text-anchor="middle" 
        letter-spacing="-1" opacity="0.95">TC</text>
</svg>