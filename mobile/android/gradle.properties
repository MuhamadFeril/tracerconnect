org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Fix "this and base files have different roots": the Kotlin incremental
# compiler stores file paths relative to the project root, which breaks on
# Windows when the pub cache (C:) is on a different drive than the project
# (D:). Disabling incremental compilation avoids the cross-drive relative
# path entirely. Slower rebuilds, but reliable.
kotlin.incremental=false
