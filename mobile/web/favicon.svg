<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TracerConnect">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="32" height="32" rx="6" fill="url(#bgGradient)"/>
  
  <g stroke="url(#accentGradient)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M16 16 L16 8" />
    <path d="M16 16 L16 24" />
    <path d="M16 16 L8 16" />
    <path d="M16 16 L24 16" />
  </g>
  
  <g fill="url(#accentGradient)">
    <circle cx="16" cy="16" r="4" filter="url(#glow)"/>
    <circle cx="16" cy="8" r="2.5"/>
    <circle cx="16" cy="24" r="2.5"/>
    <circle cx="8" cy="16" r="2.5"/>
    <circle cx="24" cy="16" r="2.5"/>
  </g>
</svg>