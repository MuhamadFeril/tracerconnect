name: tracerconnect_mobile
description: >-
  Aplikasi mobile alumni TracerAlumni — tracer study, kuisioner, career center,
  dan jejaring alumni dalam satu genggaman.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.0

  # State management & routing
  flutter_riverpod: ^2.4.10
  go_router: ^13.0.1

  # Local storage
  flutter_secure_storage: ^9.0.0

  # Media & platform
  image_picker: ^1.0.5
  file_picker: ^10.0.0
  url_launcher: ^6.2.4
  google_sign_in: ^7.2.0

  # Push notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1

  # E2E Encryption
  encrypt: ^5.0.3
  convert: ^3.1.1
  pointycastle: ^3.9.1

  # Typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/favicon-512.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/favicon-512.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/favicon-512.png"
    background_color: "#1e3a8a"
    theme_color: "#3b82f6"
  windows:
    generate: true
    image_path: "assets/icon/favicon-512.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/favicon-512.png"
