name: tracerconnect_mobile
description: >-
  Aplikasi mobile alumni TracerConnect — tracer study, kuisioner, career center,
  dan jejaring alumni dalam satu genggaman.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.0

  # State management & routing
  flutter_riverpod: ^2.4.10
  go_router: ^13.0.1

  # Local storage
  flutter_secure_storage: ^9.0.0

  # Media & platform
  image_picker: ^1.0.5
  url_launcher: ^6.2.4
  google_sign_in: ^7.2.0

  # Push notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
